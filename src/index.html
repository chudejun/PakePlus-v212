<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>冲刺能量PK榜 - 多维度积分</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1c1c1c 0%, #2d2d2d 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
        }
        
        .container {
            width: 95%;
            max-width: 1800px;
            background: rgba(45, 45, 45, 0.9);
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            padding: 30px;
            margin: 20px 0;
            position: relative;
            overflow: hidden;
        }
        
        /* 标题样式 */
        .header {
            text-align: center;
            margin-bottom: 30px;
            position: relative;
            z-index: 2;
        }
        
        .header h1 {
            font-size: 3.5rem;
            background: linear-gradient(45deg, #4cc9f0, #7209b7, #ff6b6b, #06d6a0);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.1);
        }
        
        .header p {
            font-size: 1.3rem;
            color: #aaaaaa;
            max-width: 800px;
            margin: 0 auto;
            line-height: 1.6;
        }
        
        /* 控制面板 */
        .control-panel {
            display: flex;
            justify-content: space-between;
            background: #2d2d2d;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #404040;
        }
        
        .btn-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        
        .import-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .file-input {
            display: none;
        }
        
        .file-label, .action-btn {
            background: #4cc9f0;
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(76, 201, 240, 0.4);
            border: none;
            font-size: 1rem;
        }
        
        .file-label:hover, .action-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(76, 201, 240, 0.5);
        }
        
        .export-btn {
            background: #7209b7;
            box-shadow: 0 4px 10px rgba(114, 9, 183, 0.4);
        }
        
        .export-btn:hover {
            background: #5a078f;
            box-shadow: 0 6px 15px rgba(114, 9, 183, 0.5);
        }
        
        .reset-btn {
            background: #ff6b6b;
            box-shadow: 0 4px 10px rgba(255, 107, 107, 0.4);
        }
        
        .reset-btn:hover {
            background: #e55c5c;
            box-shadow: 0 6px 15px rgba(255, 107, 107, 0.5);
        }
        
        .backup-btn {
            background: #06d6a0;
            box-shadow: 0 4px 10px rgba(6, 214, 160, 0.4);
        }
        
        .backup-btn:hover {
            background: #05b78c;
            box-shadow: 0 6px 15px rgba(6, 214, 160, 0.5);
        }
        
        #fileName {
            font-weight: 500;
            color: #cccccc;
        }
        
        /* 积分板块容器 */
        .score-sections {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .score-section {
            background: #2d2d2d;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            border: 1px solid #404040;
            transition: all 0.3s ease;
        }
        
        .score-section:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }
        
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid;
        }
        
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .section-icon {
            font-size: 1.8rem;
        }
        
        .section-score {
            font-size: 1.8rem;
            font-weight: 800;
        }
        
        .section-description {
            font-size: 1rem;
            color: #aaaaaa;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        
        /* 不同板块的颜色 */
        .question-section {
            border-color: #4cc9f0;
        }
        
        .question-section .section-header {
            border-bottom-color: #4cc9f0;
        }
        
        .question-section .section-title {
            color: #4cc9f0;
        }
        
        .self-discipline-section {
            border-color: #06d6a0;
        }
        
        .self-discipline-section .section-header {
            border-bottom-color: #06d6a0;
        }
        
        .self-discipline-section .section-title {
            color: #06d6a0;
        }
        
        .responsibility-section {
            border-color: #ff6b6b;
        }
        
        .responsibility-section .section-header {
            border-bottom-color: #ff6b6b;
        }
        
        .responsibility-section .section-title {
            color: #ff6b6b;
        }
        
        .summary-section {
            border-color: #7209b7;
        }
        
        .summary-section .section-header {
            border-bottom-color: #7209b7;
        }
        
        .summary-section .section-title {
            color: #7209b7;
        }
        
        /* 排行榜区域 */
        .leaderboard-container {
            background: linear-gradient(135deg, #4cc9f0 0%, #7209b7 100%);
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 30px;
            position: relative;
            overflow: hidden;
            border: 1px solid #404040;
        }
        
        .leaderboard-title {
            text-align: center;
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: 700;
        }
        
        .leaderboard {
            height: 60px;
            overflow: hidden;
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px;
        }
        
        .leaderboard-content {
            position: absolute;
            width: 100%;
            animation: scrollLeaderboard 20s linear infinite;
            text-align: center;
            font-size: 1.5rem;
            color: #ffffff;
            font-weight: 700;
        }
        
        @keyframes scrollLeaderboard {
            0% { top: 100%; }
            5% { top: 50%; transform: translateY(-50%); }
            20% { top: 50%; transform: translateY(-50%); }
            25% { top: 0; transform: translateY(-100%); }
            100% { top: 0; transform: translateY(-100%); }
        }
        
        /* PK卡片区域 */
        .pk-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }
        
        .group-card {
            background: #2d2d2d;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
            border: 1px solid #404040;
            transition: all 0.3s ease;
        }
        
        .group-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            border-color: #4cc9f0;
        }
        
        .group-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px dashed #404040;
        }
        
        .group-title {
            font-size: 1.8rem;
            color: #4cc9f0;
            font-weight: 700;
            background: rgba(76, 201, 240, 0.1);
            padding: 5px 15px;
            border-radius: 30px;
        }
        
        .group-score {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ff6b6b;
        }
        
        .students-container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }
        
        .student-card {
            flex: 1;
            background: #1f1f1f;
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            border: 1px solid #404040;
            transition: all 0.3s ease;
        }
        
        .student-card:hover {
            border-color: #4cc9f0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
        }
        
        .student-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 15px;
            text-align: center;
        }
        
        .student-scores {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }
        
        .score-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            border-radius: 8px;
            background: #2d2d2d;
        }
        
        .score-label {
            font-size: 0.9rem;
            color: #aaaaaa;
            margin-bottom: 5px;
        }
        
        .score-value {
            font-size: 1.5rem;
            font-weight: 700;
        }
        
        .question-score .score-value {
            color: #4cc9f0;
        }
        
        .discipline-score .score-value {
            color: #06d6a0;
        }
        
        .responsibility-score .score-value {
            color: #ff6b6b;
        }
        
        .summary-score .score-value {
            color: #7209b7;
            font-size: 1.8rem;
        }
        
        .score-controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            width: 100%;
        }
        
        .score-btn {
            padding: 8px 5px;
            border-radius: 6px;
            border: none;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }
        
        .score-btn:active {
            transform: scale(0.95);
        }
        
        .question-btn {
            background: #4cc9f0;
            color: white;
        }
        
        .question-btn:hover {
            background: #3aa8d0;
        }
        
        .discipline-btn {
            background: #06d6a0;
            color: white;
        }
        
        .discipline-btn:hover {
            background: #05b78c;
        }
        
        .responsibility-btn {
            background: #ff6b6b;
            color: white;
        }
        
        .responsibility-btn:hover {
            background: #e55c5c;
        }
        
        .vs-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #4cc9f0;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: #ffffff;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            z-index: 2;
        }
        
        /* 响应式设计 */
        @media (max-width: 1600px) {
            .pk-container {
                grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            }
            
            .score-sections {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        
        @media (max-width: 1200px) {
            .pk-container {
                grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            }
        }
        
        @media (max-width: 900px) {
            .pk-container {
                grid-template-columns: 1fr;
            }
            
            .score-sections {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2.5rem;
            }
            
            .control-panel {
                flex-direction: column;
                align-items: center;
            }
            
            .btn-group {
                width: 100%;
                justify-content: center;
            }
            
            .students-container {
                flex-direction: column;
            }
        }
        
        /* 加载动画 */
        .loading {
            display: none;
            text-align: center;
            padding: 30px;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 5px solid rgba(76, 201, 240, 0.3);
            border-radius: 50%;
            border-top-color: #4cc9f0;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 底部信息 */
        .footer {
            text-align: center;
            color: #aaaaaa;
            margin-top: 20px;
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        /* 模态框 */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: #2d2d2d;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #404040;
        }
        
        .modal h2 {
            color: #4cc9f0;
            margin-bottom: 15px;
        }
        
        .modal p {
            margin-bottom: 20px;
            line-height: 1.6;
            color: #cccccc;
        }
        
        .modal-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }
        
        .modal-btn {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .modal-confirm {
            background: #4cc9f0;
            color: white;
        }
        
        .modal-cancel {
            background: #404040;
            color: white;
        }
        
        /* 组别导航 */
        .group-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .group-nav-btn {
            padding: 8px 15px;
            background: #404040;
            color: #cccccc;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .group-nav-btn:hover {
            background: #4cc9f0;
            color: white;
        }
        
        .group-nav-btn.active {
            background: #4cc9f0;
            color: white;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>冲刺能量PK榜</h1>
            <p>激发学习动力，培养竞争意识！每两个同学一组进行多维度能力PK，加油冲刺吧！</p>
        </div>
        
        <div class="control-panel">
            <div class="import-section">
                <input type="file" id="fileInput" class="file-input" accept=".xlsx, .xls, .csv">
                <label for="fileInput" class="file-label">
                    <i class="fas fa-file-import"></i> 导入学生名单
                </label>
                <span id="fileName">未选择文件</span>
            </div>
            <div class="btn-group">
                <button id="exportBtn" class="action-btn export-btn">
                    <i class="fas fa-file-export"></i> 导出数据
                </button>
                <button id="backupBtn" class="action-btn backup-btn">
                    <i class="fas fa-hdd"></i> 备份到D盘
                </button>
                <button id="resetBtn" class="action-btn reset-btn">
                    <i class="fas fa-trash-alt"></i> 清空数据
                </button>
            </div>
        </div>
        
        <!-- 积分板块 -->
        <div class="score-sections">
            <div class="score-section question-section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-question-circle section-icon"></i>
                        <span>善问积分</span>
                    </div>
                    <div class="section-score" id="questionTotal">0</div>
                </div>
                <div class="section-description">
                    鼓励学生积极提问，勇于探索未知，培养求知精神。
                </div>
            </div>
            
            <div class="score-section self-discipline-section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-user-check section-icon"></i>
                        <span>自律积分</span>
                    </div>
                    <div class="section-score" id="disciplineTotal">0</div>
                </div>
                <div class="section-description">
                    培养学生自我管理能力，按时完成任务，遵守纪律。
                </div>
            </div>
            
            <div class="score-section responsibility-section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-hands-helping section-icon"></i>
                        <span>责任积分</span>
                    </div>
                    <div class="section-score" id="responsibilityTotal">0</div>
                </div>
                <div class="section-description">
                    培养学生责任感，关心集体，乐于助人，勇于担当。
                </div>
            </div>
            
            <div class="score-section summary-section">
                <div class="section-header">
                    <div class="section-title">
                        <i class="fas fa-chart-line section-icon"></i>
                        <span>汇总积分</span>
                    </div>
                    <div class="section-score" id="summaryTotal">0</div>
                </div>
                <div class="section-description">
                    学生综合表现总积分，反映学生在各方面的整体表现。
                </div>
            </div>
        </div>
        
        <!-- 排行榜 -->
        <div class="leaderboard-container">
            <div class="leaderboard-title">🏆 汇总积分TOP5 🏆</div>
            <div class="leaderboard">
                <div class="leaderboard-content" id="leaderboardContent">
                    正在加载排行榜...
                </div>
            </div>
        </div>
        
        <!-- 组别导航 -->
        <div class="group-nav" id="groupNav">
            <!-- 组别导航按钮将通过JavaScript动态生成 -->
        </div>
        
        <!-- 加载动画 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>正在加载学生数据，请稍候...</p>
        </div>
        
        <!-- PK卡片区域 -->
        <div class="pk-container" id="pkContainer">
            <!-- PK卡片将通过JavaScript动态生成 -->
        </div>
    </div>
    
    <div class="footer">
        <p>冲刺能量PK榜系统 | 为学习加油，为梦想助力！</p>
    </div>
    
    <!-- 确认模态框 -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <h2>确认操作</h2>
            <p id="modalMessage">您确定要执行此操作吗？</p>
            <div class="modal-buttons">
                <button id="modalConfirm" class="modal-btn modal-confirm">确认</button>
                <button id="modalCancel" class="modal-btn modal-cancel">取消</button>
            </div>
        </div>
    </div>

    <script>
        // 初始示例数据 - 20组，每组2个学生
        let students = [];
        
        // 生成20组学生数据
        for (let group = 1; group <= 20; group++) {
            students.push({
                name: `学生${group}A`,
                group: group,
                scores: {
                    question: Math.floor(Math.random() * 10),
                    discipline: Math.floor(Math.random() * 10),
                    responsibility: Math.floor(Math.random() * 10)
                }
            });
            
            students.push({
                name: `学生${group}B`,
                group: group,
                scores: {
                    question: Math.floor(Math.random() * 10),
                    discipline: Math.floor(Math.random() * 10),
                    responsibility: Math.floor(Math.random() * 10)
                }
            });
        }
        
        // 页面加载时初始化
        document.addEventListener('DOMContentLoaded', function() {
            // 尝试从本地存储加载数据
            const savedData = localStorage.getItem('pkData');
            if (savedData) {
                students = JSON.parse(savedData);
            }
            
            renderGroupNav();
            renderPKCards();
            updateLeaderboard();
            updateScoreTotals();
            
            // 设置模态框事件
            document.getElementById('modalCancel').addEventListener('click', closeModal);
        });
        
        // 渲染组别导航
        function renderGroupNav() {
            const groupNav = document.getElementById('groupNav');
            groupNav.innerHTML = '';
            
            // 创建组别导航按钮
            for (let i = 1; i <= 20; i++) {
                const button = document.createElement('button');
                button.className = 'group-nav-btn';
                button.textContent = `第${i}组`;
                button.setAttribute('data-group', i);
                
                button.addEventListener('click', function() {
                    // 移除所有按钮的active类
                    document.querySelectorAll('.group-nav-btn').forEach(btn => {
                        btn.classList.remove('active');
                    });
                    
                    // 添加当前按钮的active类
                    this.classList.add('active');
                    
                    // 滚动到对应组别
                    const groupElement = document.getElementById(`group-${i}`);
                    if (groupElement) {
                        groupElement.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                });
                
                groupNav.appendChild(button);
            }
            
            // 默认激活第一组
            if (groupNav.firstChild) {
                groupNav.firstChild.classList.add('active');
            }
        }
        
        // 渲染PK卡片
        function renderPKCards() {
            const container = document.getElementById('pkContainer');
            container.innerHTML = '';
            
            // 按组号分组
            const groups = {};
            students.forEach(student => {
                if (!groups[student.group]) {
                    groups[student.group] = [];
                }
                groups[student.group].push(student);
            });
            
            // 为每个组创建卡片，按组号排序
            const sortedGroupIds = Object.keys(groups).sort((a, b) => parseInt(a) - parseInt(b));
            
            sortedGroupIds.forEach(groupId => {
                const groupStudents = groups[groupId];
                if (groupStudents.length > 0) {
                    const groupCard = document.createElement('div');
                    groupCard.className = 'group-card';
                    groupCard.id = `group-${groupId}`;
                    
                    // 计算小组总分
                    const groupScore = groupStudents.reduce((sum, student) => {
                        return sum + student.scores.question + student.scores.discipline + student.scores.responsibility;
                    }, 0);
                    
                    groupCard.innerHTML = `
                        <div class="group-header">
                            <div class="group-title">第${groupId}组</div>
                            <div class="group-score">小组总分: ${groupScore}</div>
                        </div>
                        <div class="students-container">
                            ${groupStudents.map(student => {
                                const totalScore = student.scores.question + student.scores.discipline + student.scores.responsibility;
                                return `
                                <div class="student-card">
                                    <div class="student-name">${student.name}</div>
                                    <div class="student-scores">
                                        <div class="score-item question-score">
                                            <div class="score-label">善问</div>
                                            <div class="score-value">${student.scores.question}</div>
                                        </div>
                                        <div class="score-item discipline-score">
                                            <div class="score-label">自律</div>
                                            <div class="score-value">${student.scores.discipline}</div>
                                        </div>
                                        <div class="score-item responsibility-score">
                                            <div class="score-label">责任</div>
                                            <div class="score-value">${student.scores.responsibility}</div>
                                        </div>
                                        <div class="score-item summary-score">
                                            <div class="score-label">汇总</div>
                                            <div class="score-value">${totalScore}</div>
                                        </div>
                                    </div>
                                    <div class="score-controls">
                                        <button class="score-btn question-btn" data-id="${student.name}" data-type="question">善问+1</button>
                                        <button class="score-btn discipline-btn" data-id="${student.name}" data-type="discipline">自律+1</button>
                                        <button class="score-btn responsibility-btn" data-id="${student.name}" data-type="responsibility">责任+1</button>
                                    </div>
                                </div>
                            `}).join('')}
                        </div>
                        <div class="vs-container">VS</div>
                    `;
                    
                    container.appendChild(groupCard);
                }
            });
            
            // 添加事件监听器
            document.querySelectorAll('.score-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const studentName = this.getAttribute('data-id');
                    const scoreType = this.getAttribute('data-type');
                    updateScore(studentName, scoreType, 1);
                });
            });
        }
        
        // 更新分数
        function updateScore(studentName, scoreType, change) {
            const student = students.find(s => s.name === studentName);
            if (student) {
                student.scores[scoreType] = Math.max(0, student.scores[scoreType] + change);
                saveData();
                renderPKCards();
                updateLeaderboard();
                updateScoreTotals();
            }
        }
        
        // 更新排行榜
        function updateLeaderboard() {
            const leaderboardContent = document.getElementById('leaderboardContent');
            
            // 按总分排序并取前5名
            const sortedStudents = [...students].sort((a, b) => {
                const totalA = a.scores.question + a.scores.discipline + a.scores.responsibility;
                const totalB = b.scores.question + b.scores.discipline + b.scores.responsibility;
                return totalB - totalA;
            }).slice(0, 5);
            
            if (sortedStudents.length > 0) {
                // 创建动画内容 - 多个条目用于滚动
                let contentHTML = '';
                for (let i = 0; i < 5; i++) {
                    const totalScore = sortedStudents[i].scores.question + 
                                      sortedStudents[i].scores.discipline + 
                                      sortedStudents[i].scores.responsibility;
                    contentHTML += `<div>${i+1}. ${sortedStudents[i].name} - ${totalScore}分</div>`;
                }
                // 重复内容以实现无缝滚动
                leaderboardContent.innerHTML = contentHTML + contentHTML;
            } else {
                leaderboardContent.innerHTML = '暂无数据';
            }
        }
        
        // 更新积分板块的总分
        function updateScoreTotals() {
            // 计算各维度总分
            const questionTotal = students.reduce((sum, student) => sum + student.scores.question, 0);
            const disciplineTotal = students.reduce((sum, student) => sum + student.scores.discipline, 0);
            const responsibilityTotal = students.reduce((sum, student) => sum + student.scores.responsibility, 0);
            const summaryTotal = questionTotal + disciplineTotal + responsibilityTotal;
            
            // 更新显示
            document.getElementById('questionTotal').textContent = questionTotal;
            document.getElementById('disciplineTotal').textContent = disciplineTotal;
            document.getElementById('responsibilityTotal').textContent = responsibilityTotal;
            document.getElementById('summaryTotal').textContent = summaryTotal;
        }
        
        // 保存数据到本地存储
        function saveData() {
            localStorage.setItem('pkData', JSON.stringify(students));
        }
        
        // 文件导入处理
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            document.getElementById('fileName').textContent = file.name;
            document.getElementById('loading').style.display = 'block';
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // 获取第一个工作表
                    const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);
                    
                    // 处理导入的数据
                    if (jsonData.length > 0) {
                        students = [];
                        let groupCounter = 1;
                        let groupMembers = 0;
                        
                        jsonData.forEach((row, index) => {
                            const studentName = row['姓名'] || row['名字'] || row['学生'] || `学生${index+1}`;
                            
                            if (groupMembers >= 2) {
                                groupCounter++;
                                groupMembers = 0;
                            }
                            
                            students.push({
                                name: studentName,
                                group: groupCounter,
                                scores: {
                                    question: 0,
                                    discipline: 0,
                                    responsibility: 0
                                }
                            });
                            
                            groupMembers++;
                        });
                        
                        saveData();
                        renderGroupNav();
                        renderPKCards();
                        updateLeaderboard();
                        updateScoreTotals();
                    }
                } catch (error) {
                    alert('文件处理错误: ' + error.message);
                } finally {
                    document.getElementById('loading').style.display = 'none';
                }
            };
            
            reader.readAsArrayBuffer(file);
        });
        
        // 导出数据
        document.getElementById('exportBtn').addEventListener('click', function() {
            // 创建工作簿
            const wb = XLSX.utils.book_new();
            
            // 准备数据
            const exportData = students.map(student => ({
                '姓名': student.name,
                '组别': student.group,
                '善问积分': student.scores.question,
                '自律积分': student.scores.discipline,
                '责任积分': student.scores.responsibility,
                '汇总积分': student.scores.question + student.scores.discipline + student.scores.responsibility
            }));
            
            // 创建工作表
            const ws = XLSX.utils.json_to_sheet(exportData);
            
            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, 'PK数据');
            
            // 导出文件
            XLSX.writeFile(wb, '冲刺能量PK榜数据.xlsx');
        });
        
        // 备份到D盘
        document.getElementById('backupBtn').addEventListener('click', function() {
            // 创建工作簿
            const wb = XLSX.utils.book_new();
            
            // 准备数据
            const exportData = students.map(student => ({
                '姓名': student.name,
                '组别': student.group,
                '善问积分': student.scores.question,
                '自律积分': student.scores.discipline,
                '责任积分': student.scores.responsibility,
                '汇总积分': student.scores.question + student.scores.discipline + student.scores.responsibility
            }));
            
            // 创建工作表
            const ws = XLSX.utils.json_to_sheet(exportData);
            
            // 将工作表添加到工作簿
            XLSX.utils.book_append_sheet(wb, ws, 'PK数据');
            
            // 导出文件，文件名包含日期时间
            const now = new Date();
            const dateStr = `${now.getFullYear()}${(now.getMonth()+1).toString().padStart(2, '0')}${now.getDate().toString().padStart(2, '0')}_${now.getHours().toString().padStart(2, '0')}${now.getMinutes().toString().padStart(2, '0')}`;
            XLSX.writeFile(wb, `冲刺能量PK榜数据_${dateStr}.xlsx`);
            
            // 显示提示
            showModal("备份成功", "数据已成功导出为Excel文件。请将文件保存到D盘或其他安全位置。");
        });
        
        // 清空数据
        document.getElementById('resetBtn').addEventListener('click', function() {
            showModal("确认清空数据", "您确定要清空所有数据吗？此操作不可恢复！", function() {
                students = [];
                localStorage.removeItem('pkData');
                renderGroupNav();
                renderPKCards();
                updateLeaderboard();
                updateScoreTotals();
            });
        });
        
        // 显示模态框
        function showModal(title, message, confirmCallback) {
            document.getElementById('modalMessage').textContent = message;
            const modal = document.getElementById('confirmModal');
            modal.style.display = 'flex';
            
            const confirmBtn = document.getElementById('modalConfirm');
            confirmBtn.onclick = function() {
                if (confirmCallback) confirmCallback();
                closeModal();
            };
        }
        
        // 关闭模态框
        function closeModal() {
            document.getElementById('confirmModal').style.display = 'none';
        }
        
        // 初始化页面
        renderGroupNav();
        renderPKCards();
        updateLeaderboard();
        updateScoreTotals();
    </script>
</body>
</html>
